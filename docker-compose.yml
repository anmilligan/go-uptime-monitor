services:
  postgres:
    image: postgres:17.5
    container_name: postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"


  redis:
    image: redis:7-alpine
    container_name: uptime-monitor-redis

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"


  uptime-monitor:
    build:
      context: .
      dockerfile: Dockerfile

    image: uptime-monitor:local
    container_name: uptime-monitor-app

    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      REDIS_ADDR: redis:6379
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/readyz | grep -q '\"status\":\"ready\"'"
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"


  prometheus:
    image: prom/prometheus:latest
    container_name: uptime-monitor-prometheus

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "9090:9090"

    depends_on:
      uptime-monitor:
        condition: service_healthy

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"

    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"


  grafana:
    image: grafana/grafana:latest
    container_name: uptime-monitor-grafana

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"


volumes:
  postgres_data:
  prometheus_data:

  grafana_data:
    external: true
    name: uptime-monitor-grafana-data