services:
  postgres:
    image: postgres:17.5
    container_name: postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
      build:
        context: .
        dockerfile: Dockerfile.migrate
      image: uptime-monitor-migrate:local
      container_name: uptime-monitor-migrate
      command:
        - postgres
        - "postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable"
        - up
      depends_on:
        postgres:
          condition: service_healthy
      restart: "no"

  redis:
    image: redis:7-alpine
    container_name: uptime-monitor-redis

    ports:
      - "127.0.0.1:6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"


  uptime-monitor:
    build:
      context: .
      dockerfile: Dockerfile

    image: uptime-monitor:local
    container_name: uptime-monitor-app

    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      REDIS_ADDR: redis:6379
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/readyz | grep -q '\"status\":\"ready\"'"
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"


  prometheus:
    image: prom/prometheus:latest
    container_name: uptime-monitor-prometheus

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "127.0.0.1:9090:9090"

    depends_on:
      uptime-monitor:
        condition: service_healthy

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"

    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"


  grafana:
    image: grafana/grafana:latest
    container_name: uptime-monitor-grafana

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus

    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"


volumes:
  postgres_data:
  prometheus_data:
  grafana_data: